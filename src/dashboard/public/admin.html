<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elite X - Developer Console</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-body: #121212;
      --bg-surface: #1e1e1e;
      --bg-hover: #2a2a2a;
      --bg-striped: rgba(255, 255, 255, 0.02);
      
      --border: rgba(255, 255, 255, 0.06);
      --border-light: rgba(255, 255, 255, 0.12);
      
      --text-main: #ededed;
      --text-muted: #a1a1aa;
      --text-disabled: #52525b;
      
      --accent: #d4af37; /* Muted gold */
      
      --radius: 6px;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'Menlo', 'Monaco', 'Courier New', monospace;
      
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;
      --space-5: 48px;
      --space-6: 64px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Typography */
    h1, h2, h3 { font-weight: 600; color: var(--text-main); }
    h1 { font-size: 1.25rem; }
    h2 { font-size: 1.1rem; margin-bottom: var(--space-2); }
    h3 { font-size: 1rem; }
    p { color: var(--text-muted); }
    
    .text-muted { color: var(--text-muted); }
    .tabular { font-variant-numeric: tabular-nums; }
    .mono { font-family: var(--font-mono); font-size: 13px; color: var(--text-muted); }

    /* Layout */
    .header {
      border-bottom: 1px solid var(--border);
      background-color: var(--bg-surface);
      padding: var(--space-2) var(--space-4);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
    .header-title svg { stroke: var(--text-muted); }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: var(--space-5) var(--space-3);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font-sans);
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      outline: none;
      text-decoration: none;
    }
    .btn:focus-visible {
      box-shadow: 0 0 0 2px var(--bg-body), 0 0 0 4px var(--accent);
    }

    .btn-outline {
      background-color: transparent;
      border-color: var(--border);
      color: var(--text-main);
    }
    .btn-outline:hover:not(:disabled) {
      background-color: var(--bg-hover);
      border-color: var(--border-light);
    }
    .btn-outline:active:not(:disabled) {
      background-color: rgba(255,255,255,0.05);
    }

    .btn:disabled {
      cursor: not-allowed;
      color: var(--text-disabled);
      border-color: var(--border);
    }

    /* Click to copy */
    .copy-id {
      cursor: pointer;
      transition: color 0.15s;
    }
    .copy-id:hover {
      color: var(--text-main);
    }
    .copy-id:active {
      color: var(--accent);
    }

    /* Cards */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--space-3);
      margin-bottom: var(--space-5);
    }

    .card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--space-3);
    }

    .stat-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: var(--space-1);
    }
    
    .stat-value {
      font-size: 2rem;
      font-weight: 600;
      color: var(--text-main);
    }

    /* Coming Soon Section */
    .premium-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--bg-striped);
      border: 1px solid var(--border);
      padding: var(--space-3);
      border-radius: var(--radius);
      margin-bottom: var(--space-6);
    }
    .badge-soon {
      display: inline-block;
      background-color: var(--border);
      color: var(--text-muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: var(--space-1);
      vertical-align: middle;
    }

    /* Table */
    .table-container {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 600;
      padding: var(--space-2) var(--space-3);
      border-bottom: 1px solid var(--border);
      background-color: var(--bg-surface);
    }

    td {
      padding: var(--space-2) var(--space-3);
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
      vertical-align: middle;
    }

    tbody tr:nth-child(even) {
      background-color: var(--bg-striped);
    }

    tbody tr:hover {
      background-color: var(--bg-hover);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .guild-icon {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      object-fit: cover;
      margin-right: var(--space-2);
      vertical-align: middle;
      background-color: var(--border);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .server-name-cell {
      display: flex;
      align-items: center;
      font-weight: 500;
    }

    /* Skeleton Loading */
    .skeleton {
      background: var(--border);
      border-radius: 4px;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .skeleton-text { height: 16px; width: 100%; }
    .skeleton-text.short { width: 40%; }
    .skeleton-icon { width: 24px; height: 24px; }
    .skeleton-value { height: 32px; width: 60px; margin-top: var(--space-1); }

    /* Error State */
    .error-msg {
      color: #ef4444;
      background-color: rgba(239, 68, 68, 0.1);
      padding: var(--space-2);
      border-radius: var(--radius);
      border: 1px solid rgba(239, 68, 68, 0.2);
      font-size: 13px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: var(--space-4);
      right: var(--space-4);
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius);
      font-size: 13px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 100;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      .premium-section {
        flex-direction: column;
        align-items: flex-start;
        gap: var(--space-3);
      }
      .header { padding: var(--space-2); }
      .container { padding: var(--space-4) var(--space-2); }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      <h1>Developer Console</h1>
    </div>
    <a href="/dashboard" class="btn btn-outline">Back to App</a>
  </header>

  <main class="container">
    
    <div id="error-container" style="display: none; margin-bottom: var(--space-4);"></div>

    <h2>System Overview</h2>
    <div class="grid-2">
      <div class="card">
        <div class="stat-label">Total Servers</div>
        <div class="stat-value tabular skeleton skeleton-value" id="total-servers"></div>
      </div>
      <div class="card">
        <div class="stat-label">Total Users Reached</div>
        <div class="stat-value tabular skeleton skeleton-value" id="total-users"></div>
      </div>
    </div>

    <div class="premium-section">
      <div>
        <h3 style="margin-bottom: var(--space-1);">Premium Management <span class="badge-soon">Soon</span></h3>
        <p style="font-size: 13px;">Manage quota limits and model overrides for specific guilds.</p>
      </div>
      <button class="btn btn-outline" disabled>Manage Premium</button>
    </div>

    <h2>Connected Servers</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Server Name</th>
            <th>Server ID</th>
            <th>Members</th>
            <th>Owner ID</th>
            <th>Joined At</th>
          </tr>
        </thead>
        <tbody id="admin-table-body">
          <!-- Skeletons -->
          <tr>
            <td><div style="display: flex; gap: 8px;"><div class="skeleton skeleton-icon"></div><div class="skeleton skeleton-text" style="width: 120px;"></div></div></td>
            <td><div class="skeleton skeleton-text short"></div></td>
            <td><div class="skeleton skeleton-text short"></div></td>
            <td><div class="skeleton skeleton-text short"></div></td>
            <td><div class="skeleton skeleton-text short"></div></td>
          </tr>
          <tr>
            <td><div style="display: flex; gap: 8px;"><div class="skeleton skeleton-icon"></div><div class="skeleton skeleton-text" style="width: 90px;"></div></div></td>
            <td><div class="skeleton skeleton-text short"></div></td>
            <td><div class="skeleton skeleton-text short"></div></td>
            <td><div class="skeleton skeleton-text short"></div></td>
            <td><div class="skeleton skeleton-text short"></div></td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <div id="toast" class="toast">Copied to clipboard</div>

  <script>
    function escapeHtml(unsafe) {
      return (unsafe || '').toString()
           .replace(/&/g, "&amp;")
           .replace(/</g, "&lt;")
           .replace(/>/g, "&gt;")
           .replace(/"/g, "&quot;")
           .replace(/'/g, "&#039;");
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    async function copyToClipboard(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast('Copied: ' + text);
      } catch (err) {
        showToast('Failed to copy');
      }
    }

    function bindCopyEvents() {
      document.querySelectorAll('.copy-id').forEach(el => {
        el.addEventListener('click', (e) => {
          copyToClipboard(e.target.textContent.trim());
        });
      });
    }

    async function loadAdminData() {
      try {
        const res = await fetch('/api/admin/stats');
        
        if (res.status === 401 || res.status === 403) {
          const errData = await res.json().catch(()=>({}));
          alert(errData.error || 'Access Denied. You are not the Developer. Redirecting...');
          window.location.href = '/dashboard';
          return;
        }
        
        if (!res.ok) throw new Error('API returned status ' + res.status);
        
        const data = await res.json();
        
        const totalServersEl = document.getElementById('total-servers');
        const totalUsersEl = document.getElementById('total-users');
        
        totalServersEl.classList.remove('skeleton', 'skeleton-value');
        totalUsersEl.classList.remove('skeleton', 'skeleton-value');
        
        totalServersEl.textContent = data.totalGuilds;
        totalUsersEl.textContent = data.totalUsers.toLocaleString();
        
        const tbody = document.getElementById('admin-table-body');
        tbody.innerHTML = '';
        
        if (!data.guilds || data.guilds.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding: 40px;">No servers connected yet.</td></tr>';
          return;
        }
        
        data.guilds.sort((a, b) => b.memberCount - a.memberCount).forEach(g => {
          const tr = document.createElement('tr');
          const date = new Date(g.joinedAt).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
          const escapedName = escapeHtml(g.name);
          
          const iconHtml = g.icon 
            ? `<img src="${g.icon}" class="guild-icon" alt="">`
            : `<div class="guild-icon">${escapedName.charAt(0)}</div>`;
            
          tr.innerHTML = `
            <td><div class="server-name-cell">${iconHtml} ${escapedName}</div></td>
            <td class="mono copy-id" title="Click to copy">${g.id}</td>
            <td class="tabular">${g.memberCount.toLocaleString()}</td>
            <td class="mono copy-id" title="Click to copy">${g.ownerId}</td>
            <td class="tabular" style="color: var(--text-muted);">${date}</td>`;
          tbody.appendChild(tr);
        });
        
        bindCopyEvents();
        
      } catch (err) {
        console.error(err);
        const errContainer = document.getElementById('error-container');
        errContainer.style.display = 'block';
        errContainer.innerHTML = `<div class="error-msg">Failed to load system statistics. Please try refreshing.</div>`;
        
        document.getElementById('total-servers').classList.remove('skeleton', 'skeleton-value');
        document.getElementById('total-users').classList.remove('skeleton', 'skeleton-value');
        document.getElementById('admin-table-body').innerHTML = '<tr><td colspan="5" style="text-align:center; color: var(--text-muted); padding: 20px;">Data unavailable</td></tr>';
      }
    }
    
    loadAdminData();
  </script>
</body>
</html>
